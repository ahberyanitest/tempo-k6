server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m
  complete_block_timeout: 10m
  trace_idle_period: 10s
  lifecycler:
    ring:
      replication_factor: 1
      kvstore:
        store: in-memory

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: local
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  processor:
    service_graphs:
      dimensions: [http.method]
    span_metrics:
      dimensions: [http.method, http.status_code]

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
