global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [gateway:8080]

  - job_name: catalog
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [catalog:8081]

  - job_name: inventory
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [inventory:8082]
