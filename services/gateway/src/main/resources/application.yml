spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: catalog
          uri: ${CATALOG_URL:http://localhost:8081}
          predicates:
            - Path=/api/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
